services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docvault}
      POSTGRES_DB: ${POSTGRES_DB:-docvault}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-docvault}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-docvault}:${POSTGRES_PASSWORD:-docvault}@postgres:5432/${POSTGRES_DB:-docvault}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-5-5}
      CLAUDE_EFFORT: ${CLAUDE_EFFORT:-medium}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
    volumes:
      - uploads:/data/uploads
      - models:/models
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${DOCVAULT_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads:
  models:
